name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 最小权限：这个仓库是公开的，pull_request 会执行 PR 里的代码。
# 默认 token 权限比这里需要的宽；只读 contents 足够跑测试。
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.15', '22.x', '24.x']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # 放在测试之前：纯静态、秒级、不需要依赖，失败信号最快。
      # 它拦住的是「只在 Windows 上能跑」的写法 —— preflight.mjs 曾用
      # process.env.USERPROFILE，在 ubuntu 上 undefined 直接 TypeError。
      # 自检会先注入一次该缺陷确认守卫真会报错，再恢复原文件。
      - name: Repo — portability guard (self-verifying)
        run: node .github/scripts/portability.selftest.mjs

      # 另一条仓库级检查：确认「真正会发布出去的 tarball」是完整的。
      # files 白名单漏一个被 import 的文件时，本地怎么跑都是绿的，
      # 消费者装完却缺文件 —— 这类失败原本谁也看不见。
      - name: Repo — pack contents (what npm would publish)
        run: node .github/scripts/pack-check.mjs

      # 这两个包没有依赖，只有 optional peerDependencies；npm install 只是为了拿到可解析的布局。
      - name: Install (no runtime deps)
        run: npm install --no-audit --no-fund
        working-directory: packages/dsh-plugin-redact

      - name: dsh-plugin-redact — handler suite
        run: node test/handler.selftest.mjs
        working-directory: packages/dsh-plugin-redact

      - name: dsh-plugin-redact — engine / CLI suite
        run: node test/engine.selftest.mjs
        working-directory: packages/dsh-plugin-redact

      - name: dsh-plugin-redact — torn-tail recovery
        run: node test/torn-recovery.mjs
        working-directory: packages/dsh-plugin-redact

      - name: dsh-plugin-redact — path guard / cwd independence
        run: node test/path-guard.mjs
        working-directory: packages/dsh-plugin-redact

      - name: dsh-plugin-redact — CLI smoke
        run: node test/preflight.mjs
        working-directory: packages/dsh-plugin-redact

      - name: dsh-plugin-content-policy — pure suites
        run: |
          node test/selftest.mjs
          node test/harness.mjs
        working-directory: packages/dsh-plugin-content-policy

      # 需要真实 DSH 安装的套件（handler 之外的 redact 套件、content-policy 的 e2e）在这里不跑：
      # 它们从 DSH_HOME 推导安装位置，缺失时以退出码 3 明确失败，而不是静默变绿 —— 见各包 README。
