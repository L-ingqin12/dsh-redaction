# dsh-plugin-content-policy —— 插入层
#
# 这一行只 CONSUME 宿主的 `tools` 服务（读注册表 + 监听 tools/execute、
# tools/pre-execute、tools/ptc-dispatch-log），自身不发布任何服务，所以可以
# 直接放在这里，不需要 isolate realm。
#
# 默认是**真空操作**：`rules: []` + `strip: []` ⇒ 插件不注册任何监听器（与
# dsh-spill-policy 的 "omitted config ⇒ registers nothing" 约定一致）。
#
# 两条互补的策略（同一条 tools/execute 接缝，先 strip 后正则）：
#   · rules[] —— 内容改写：字面量/正则命中即替换（需要事先知道要挡什么）；
#   · strip[] —— 结构最小化：按字段路径把整个字段丢掉或截断，用于"事先无法枚举"
#     的载荷（例如公开检索回来的任意段落）。`stripDefaults: true` 一键打开
#     web_search 的最小化：丢掉 sources.*.snippet 与模型生成的 content 答案。
#
# 要真正启用，请在你自己的 profile patch 层（$DSH_HOME/profiles/<name>/cordis.patch.yml）
# 里按 id 覆盖 config。注意：patch 是**整体替换** config 字段
# （dsh-app-boot/lib/index.js:102-105 `target[key] = value`），不是深合并，
# 所以覆盖时要把想保留的字段一并写全：
#
# - id: dsh-content-policy
#   config:
#     enabled: true
#     maxScannedBytes: 4194304
#     onBudgetExceeded: partial     # partial | error
#     onUnsafeValue: keep           # keep | error
#     onStripRefused: error         # error（默认，响亮失败）| skip
#     notify: true
#     stripDefaults: true           # web_search：丢掉 sources.*.snippet 与 content
#     strip:
#       - id: web-fetch-body
#         tool: web_fetch
#         path: body.content
#         maxChars: 2000            # body.content 是 required ⇒ 只能截断，不能丢
#       - id: any-tool-answer
#         tool: '*'                 # '*' = 所有工具
#         path: content
#     rules:
#       - id: phone
#         match: { regex: '1[3-9]\\d{9}', flags: g }
#         action: replace
#         replacement: '[已移除]'
#         tools: [web_search, web_fetch]
#       - id: no-internal-host
#         match: { literal: 'internal.example.com' }
#         action: block
#         tools: []                 # 空数组 = 所有工具
- insert:
    - id: dsh-content-policy
      name: dsh-plugin-content-policy
      config:
        enabled: true
        rules: []
        strip: []
